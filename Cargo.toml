[package]
name = "ncm_downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
cookie = "0.18.2"
cookie_store = "0.22.1"
futures = "0.3.34"
indicatif = "0.18.6"
infer = "0.22.0"
lofty = "0.25.4"
minijinja = "2.24.0"
netscape-cookie-file-parser = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls-no-provider", "stream"] }
reqwest_cookie_store = "0.10.0"
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
webpki-roots = "1.0.9"
